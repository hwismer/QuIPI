# Packages needed to run QuIPI and QuIPI HuMu (direct dependencies only).
# Versions are pinned so local runs and the Docker images match.
# To upgrade: change a version here, test locally, then rebuild the images.
name: quipi
channels:
  - conda-forge
dependencies:
  - python=3.13
  - shiny=1.9.0
  - shinywidgets=0.8.2
  - faicons=0.2.2
  - plotly=7.1.0
  - pandas=3.1.1
  - numpy=2.5.4
  - scipy=1.18.1
  - statsmodels=0.15.0
  - pyarrow=26.0.1
  - matplotlib-base=3.11.2
  - seaborn-base=0.13.2
  - uvicorn=0.54.0
